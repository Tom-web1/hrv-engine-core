<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Δⁿ HRV 自律神經體質分析（PoC）</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='report.css') }}">
</head>
<body>

<div class="section" style="max-width: 820px; margin-top: 40px;">
  <h1 style="margin-bottom: 4px; color:#1e3a8a;">Δⁿ HRV 自律神經體質分析（PoC）</h1>
  <p style="margin:0 0 12px; font-size:13px; color:#4b5563;">
    貼上或上傳您的 HRV XML（&lt;Patient ... /&gt;），系統將自動產生中醫體質＋自律神經報告。
  </p>

  {% if error %}
    <div style="background:#fee2e2; color:#b91c1c; padding:8px 10px; border-radius:6px; font-size:13px; margin-bottom:10px;">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" enctype="multipart/form-data">
    <div style="margin-bottom:12px;">
      <label style="font-size:13px; font-weight:600; color:#1f2933;">方式一：上傳 XML 檔案</label><br>
      <input type="file" name="xml_file" accept=".xml"
             style="margin-top:4px; font-size:13px;">
    </div>

    <div style="font-size:12px; color:#6b7280; margin:8px 0;">或</div>

    <div style="margin-bottom:12px;">
      <label style="font-size:13px; font-weight:600; color:#1f2933;">方式二：直接貼上 &lt;Patient ... /&gt; 內容</label><br>
      <textarea name="xml_text" rows="6"
                placeholder='<Patient Name="JACK" Sex="男" Height="173.0" ... />'
                style="width:100%; margin-top:4px; border-radius:6px; border:1px solid #d1d5db; padding:8px; font-size:13px;"></textarea>
    </div>

    <button type="submit"
            style="padding:8px 18px; border-radius:999px; border:none; font-size:13px; font-weight:600;
                   background:#1e3a8a; color:white; cursor:pointer;">
      產生體質分析報告
    </button>
  </form>

  <div style="margin-top:16px; font-size:12px; color:#6b7280;">
    ※ 本系統為概念驗證（PoC），僅供健康管理與衛教參考，不作為任何醫療診斷依據。
  </div>
</div>

</body>
</html>
